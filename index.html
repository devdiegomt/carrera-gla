<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15624a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e110e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Registro de vueltas por NFC para carreras escolares. Funciona sin conexion.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vueltas">
<title>Registro de Vueltas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-cabecera">
  <div class="recorta" style="flex:1">
    <div class="app-cabecera__titulo" id="cab-titulo">Carrera</div>
    <div class="app-cabecera__sub" id="cab-sub"></div>
  </div>
  <div class="app-cabecera__reloj" id="cab-reloj">--:--:--</div>
</header>

<button class="barra-grupo" id="barra-grupo" type="button">
  <span class="barra-grupo__etq">Grupo</span>
  <span class="barra-grupo__nombre" id="barra-grupo-nombre">—</span>
  <span class="barra-grupo__dato" id="barra-grupo-dato"></span>
</button>

<main class="contenido">

  <!-- ============ CARRERA ============ -->
  <section class="vista esta-activa" id="vista-carrera" aria-label="Carrera">
    <div class="panel panel--espera" id="panel" role="status" aria-live="assertive">
      <div class="panel__dorsal" id="panel-dorsal">—</div>
      <div class="panel__nombre" id="panel-nombre">Listo para leer</div>
      <div class="panel__detalle" id="panel-detalle">Activa la lectura y acerca una manilla</div>
      <div class="panel__pie" id="panel-pie"></div>
    </div>

    <div id="carrera-acciones"></div>
    <div id="carrera-bloques" class="pila"></div>
  </section>

  <!-- ============ INSCRIPCIÓN ============ -->
  <section class="vista" id="vista-inscripcion" aria-label="Inscripción">
    <div id="inscripcion-agregar"></div>
    <div id="inscripcion-lista"></div>
  </section>

  <!-- ============ POSICIONES ============ -->
  <section class="vista" id="vista-posiciones" aria-label="Posiciones">
    <div id="posiciones-cifras"></div>
    <div id="posiciones-controles"></div>
    <div id="posiciones-lista"></div>
  </section>

  <!-- ============ AJUSTES ============ -->
  <section class="vista" id="vista-ajustes" aria-label="Ajustes">
    <div id="ajustes-contenido"></div>
  </section>

</main>

<nav class="app-nav" id="app-nav" aria-label="Secciones"></nav>

<div class="avisos" id="avisos" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/excel.js"></script>
<script src="js/db.js"></script>
<script src="js/estado.js"></script>
<script src="js/nfc.js"></script>
<script src="js/exportar.js"></script>
<script src="js/carrera.js"></script>
<script src="js/inscripcion.js"></script>
<script src="js/posiciones.js"></script>
<script src="js/tandas.js"></script>
<script src="js/ajustes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
